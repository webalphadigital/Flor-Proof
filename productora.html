<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flor Proof · Grower</title>
<style>
:root{--ink:#1f2a44;--muted:#5b6478;--paper:#f4f6f8;--card:#fff;--line:#d5dae3;--ok:#1e7f5c;--okbg:#e2f3ec;--bad:#a3262a;--rose:#b4235a;
--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf6;--muted:#9aa4bc;--paper:#141a2b;--card:#1c2338;--line:#32405f;--ok:#4cc79a;--okbg:#17352d;--bad:#f08a8d;--rose:#ee6b9c}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
main{max-width:30rem;margin:0 auto;padding:1.3rem 1rem 3rem}
h1{font-family:var(--serif);font-size:1.7rem;margin:.1rem 0 .3rem}h1 span{color:var(--rose)}
.sub{margin:0 0 1rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:1.1rem;margin-bottom:1rem}
label{display:block;margin:.8rem 0 .25rem;color:var(--muted);font-size:.95rem}
form>label:first-child{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
input,select{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:.5rem;background:var(--card);color:var(--ink);font:inherit}
button{width:100%;margin-top:1rem;padding:.8rem 1rem;border:0;border-radius:.5rem;background:var(--ink);color:var(--paper);font:inherit;font-weight:700}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.6}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.msg{margin:0;color:var(--muted)}.msg.err{color:var(--bad)}
.ok{background:var(--okbg);color:var(--ok);border-radius:.6rem;padding:.8rem;font-weight:700;text-align:center}
.ok small{display:block;font-weight:400;margin-top:.15rem}
a{color:var(--rose)}
a.boton{display:block;margin-top:1rem;padding:.8rem 1rem;border-radius:.5rem;background:var(--ink);color:var(--paper);text-align:center;font-weight:700;text-decoration:none}
[hidden]{display:none!important}
.lang{display:flex;justify-content:flex-end;gap:.4rem;padding-top:1rem}.lang button{width:auto;margin:0;padding:.25rem .65rem;border:1px solid var(--line);border-radius:.4rem;background:transparent;color:var(--muted);font:inherit;font-size:.85rem;font-weight:700}.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<main>
<div class="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="true">EN</button><button type="button" data-l="es" aria-pressed="false">ES</button></div>
<h1>Flor <span>Proof</span> · Grower</h1>
<p class="sub">Register a batch and get its QR code.</p>

<form id="f" class="card">
  <label for="codigo">Access code</label>
  <input id="codigo" type="password" autocomplete="off" required>

  <label for="lote">Batch code</label>
  <input id="lote" class="cod" autocomplete="off" required>

  <div class="two">
    <div>
      <label for="variedad">Variety</label>
      <select id="variedad">
        <option value="Gladiolos">Gladiolus</option>
        <option value="Rosas">Roses</option>
        <option value="Claveles">Carnations</option>
        <option value="Lilium">Lilies</option>
        <option value="Gerberas">Gerberas</option>
      </select>
    </div>
    <div>
      <label for="zona">Zone</label>
      <select id="zona">
        <option value="Ramal - Yuto">Ramal - Yuto</option>
        <option value="Quebrada - Maimara">Quebrada - Maimara</option>
        <option value="Quebrada - Tilcara">Quebrada - Tilcara</option>
        <option value="Valles - Perico">Valles - Perico</option>
      </select>
    </div>
  </div>

  <label for="temporada">Season</label>
  <input id="temporada" autocomplete="off" required>

  <div class="two">
    <div><label for="paquetes">Packages</label><input id="paquetes" type="number" min="1" step="1" value="5" required></div>
    <div><label for="vida">Shelf life (days)</label><input id="vida" type="number" min="1" max="365" step="1" value="7" required></div>
  </div>

  <label for="fecha">Harvest date</label>
  <input id="fecha" type="date" required>

  <button id="btn" type="submit">Register batch</button>
</form>

<section class="card" id="out" aria-live="polite"><p class="msg">Fill in the details and tap Register batch.</p></section>
</main>

<script>
const API = "https://flor-proof-backend.vercel.app/api/registrar";
const $ = id => document.getElementById(id);
const el = (t, x, c) => { const n = document.createElement(t); if (x !== undefined) n.textContent = x; if (c) n.className = c; return n; };

let L = "en";
try { L = localStorage.getItem("fp-lang") || ((navigator.language || "").toLowerCase().startsWith("es") ? "es" : "en"); } catch (e) {}
const T = (en, es) => (L === "es" ? es : en);
const ES = {
  "Flor <span>Proof</span> · Grower": "Flor <span>Proof</span> · Productora",
  "Register a batch and get its QR code.": "Registrá un lote y obtené su QR.",
  "Access code": "Código de acceso", "Batch code": "Código del lote", "Variety": "Variedad", "Zone": "Zona",
  "Season": "Temporada", "Packages": "Paquetes", "Shelf life (days)": "Vida útil (días)", "Harvest date": "Fecha de cosecha",
  "Register batch": "Registrar lote",
  "Fill in the details and tap Register batch.": "Completá los datos y tocá Registrar lote.",
  "Gladiolus": "Gladiolos", "Roses": "Rosas", "Carnations": "Claveles", "Lilies": "Lilium"
};
let tempoAuto = "";
function applyLang() {
  document.documentElement.lang = L;
  document.querySelectorAll("body *").forEach(n => {
    if (n.tagName === "SCRIPT" || n.closest(".lang")) return;
    const h1 = n.tagName === "H1";
    if (n.children.length && !h1) return;
    if (!n.dataset.en) { const k = h1 ? n.innerHTML : n.textContent.trim(); if (!(k in ES)) return; n.dataset.en = k; }
    const v = L === "es" ? ES[n.dataset.en] : n.dataset.en;
    if (h1) n.innerHTML = v; else n.textContent = v;
  });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === L)));
  document.title = T("Flor Proof · Grower", "Flor Proof · Productora");
  $("lote").placeholder = T("E.g. LOTE-011", "Ej.: LOTE-011");
  const t = $("temporada");
  if (!t.value || t.value === tempoAuto) { tempoAuto = T("Spring 2026", "Primavera 2026"); t.value = tempoAuto; }
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { L = b.dataset.l; try { localStorage.setItem("fp-lang", L); } catch (e) {} applyLang(); }));
$("fecha").value = new Date().toISOString().slice(0, 10);
applyLang();

function mensaje(txt, esError) { $("out").replaceChildren(el("p", txt, "msg" + (esError ? " err" : ""))); }

function exito(j) {
  const out = $("out");
  const caja = el("div", T("Batch registered", "Lote registrado"), "ok");
  caja.append(el("small", j.idLote));
  const q = el("a", T("Open the QR", "Abrir el QR"), "boton");
  q.href = "qr.html?lote=" + encodeURIComponent(j.idLote); q.target = "_blank"; q.rel = "noopener";
  const otro = el("button", T("Register another batch", "Registrar otro lote"), "sec"); otro.type = "button";
  otro.addEventListener("click", () => { $("lote").value = ""; mensaje(T("Fill in the details and tap Register batch.", "Completá los datos y tocá Registrar lote.")); $("lote").focus(); });
  out.replaceChildren(caja, q, otro);
}

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = $("btn"); btn.disabled = true;
  mensaje(T("Signing… this may take a few seconds.", "Firmando… puede tardar unos segundos."));
  const cuerpo = {
    codigo: $("codigo").value, idLote: $("lote").value.trim(), variedad: $("variedad").value, zona: $("zona").value,
    temporada: $("temporada").value.trim(), paquetes: $("paquetes").value, vidaUtilDias: $("vida").value,
    fechaCosecha: $("fecha").value, lang: L
  };
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { mensaje(j.error || T("The batch could not be registered.", "No se pudo registrar el lote."), true); return; }
    exito(j);
  } catch (e) {
    mensaje(T("Can't reach the server. Please try again.", "No hay conexión con el servidor. Probá de nuevo."), true);
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
