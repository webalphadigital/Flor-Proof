<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flor Proof · Consulta de lote</title>
<style>
  :root {
    --bg1: #0a1330; --bg2: #14245a;
    --surface: rgba(255,255,255,.05); --line: rgba(130,160,255,.2);
    --text: #e9edff; --muted: #9aa8d8;
    --pink: #ff5c9a; --ok: #4ade80; --wait: #fbbf24; --bad: #ff8a8a;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { min-height: 100%; background: var(--bg1); }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed; line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 18px 48px; }
  h1 { font-size: 1.7rem; margin: 0 0 6px; letter-spacing: -.01em; }
  h1 span { color: var(--pink); }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; padding: 12px; font: inherit; color: var(--text);
    background: rgba(5,10,30,.6); border: 1px solid var(--line); border-radius: 10px;
  }
  button {
    padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--pink); border: 0; border-radius: 10px;
  }
  button.sec { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .6; cursor: wait; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .gap { height: 14px; }
  #estado { min-height: 1.4em; margin: 4px 2px 14px; color: var(--muted); }
  #estado.error { color: var(--bad); }
  .code { font-family: ui-monospace, Consolas, monospace; }
  dl { margin: 0; }
  .item { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  .titulo { font-size: 1.1rem; margin: 0 0 8px; }
  .etapa { display: flex; gap: 12px; padding: 10px 0; }
  .punto { flex: none; width: 12px; height: 12px; margin-top: 6px; border-radius: 50%; background: var(--wait); }
  .punto.ok { background: var(--ok); }
  .etapa strong { display: block; }
  .etapa small { color: var(--muted); }
  a { color: #9db8ff; }
  footer { margin-top: 22px; color: var(--muted); font-size: .85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Trazabilidad <span>de lote</span></h1>
  <p class="sub">Consultá de dónde viene un lote de flores y en qué etapa está. Los datos se leen directo del registro en Monad Testnet.</p>

  <form id="f-lote" class="box">
    <label for="lote">Código del lote</label>
    <div class="row">
      <input id="lote" class="code" placeholder="Ej.: LOTE-011" autocomplete="off" autocapitalize="characters">
      <button type="submit">Consultar</button>
    </div>
  </form>

  <form id="f-ramo" class="box">
    <label for="ramo">Código del ramo</label>
    <div class="row">
      <input id="ramo" class="code" placeholder="Ej.: RAMO-001" autocomplete="off" autocapitalize="characters">
      <button type="submit" class="sec">Consultar ramo</button>
    </div>
  </form>

  <div id="estado" role="status" aria-live="polite"></div>

  <section id="res" hidden>
    <div class="box">
      <h2 class="titulo">Recorrido</h2>
      <div id="etapas"></div>
    </div>
    <div class="box">
      <h2 class="titulo">Datos del lote <span id="idlote" class="code"></span></h2>
      <dl id="datos"></dl>
    </div>
    <div class="box" id="caja-ramo" hidden>
      <h2 class="titulo">Ramo <span id="idramo" class="code"></span></h2>
      <dl id="datos-ramo"></dl>
    </div>
  </section>

  <footer>
    Contrato: <a id="link-contrato" target="_blank" rel="noopener">ver en el explorador</a>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
// === CONFIGURACIÓN: pegá acá la dirección completa del contrato FlorProof (empieza con 0x) ===
const CONTRATO = "PEGAR_AQUI_LA_DIRECCION_DEL_CONTRATO";
// ===========================================================================================
const RPC = "https://testnet-rpc.monad.xyz";
const EXPLORADOR = "https://testnet.monadvision.com/address/";

const ABI = [
  "function consultarLote(string idLote) view returns (tuple(bytes32 datosHash, tuple(string idLote, string variedad, string zona, string temporada, uint32 paquetes, uint64 fechaCosecha, uint16 vidaUtilDias) datos, address productor, uint64 declaradoEn, address floreria, uint64 confirmadoEn, uint32 disponibles, uint64 stockActualizadoEn))",
  "function consultarRamo(string idRamo) view returns (tuple(string idLote, address floreria, uint64 creadoEn))",
  "error LoteNoExiste()",
  "error RamoNoExiste()"
];

const $ = (id) => document.getElementById(id);
const corta = (a) => a.slice(0, 6) + "…" + a.slice(-4);
const SIN_CONFIGURAR = !/^0x[0-9a-fA-F]{40}$/.test(CONTRATO);

function fechaDia(seg) {
  return new Date(Number(seg) * 1000).toLocaleDateString("es-AR", { timeZone: "UTC", day: "numeric", month: "long", year: "numeric" });
}
function fechaHora(seg) {
  return new Date(Number(seg) * 1000).toLocaleString("es-AR", { dateStyle: "medium", timeStyle: "short" });
}
function estado(txt, esError) {
  const e = $("estado");
  e.textContent = txt || "";
  e.className = esError ? "error" : "";
}
function filas(dl, pares) {
  dl.replaceChildren();
  for (const [k, v] of pares) {
    const d = document.createElement("div"); d.className = "item";
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    d.append(dt, dd); dl.append(d);
  }
}
function etapa(titulo, detalle, hecha) {
  const w = document.createElement("div"); w.className = "etapa";
  const p = document.createElement("span"); p.className = "punto" + (hecha ? " ok" : "");
  const t = document.createElement("div");
  const s = document.createElement("strong"); s.textContent = titulo;
  const m = document.createElement("small"); m.textContent = detalle;
  t.append(s, m); w.append(p, t); return w;
}
function nombreError(e) {
  return (e && e.revert && e.revert.name) || (e && e.errorName) || "";
}

async function consultar(codigoLote, codigoRamo) {
  if (SIN_CONFIGURAR) { estado("Falta pegar la dirección del contrato en consulta.html.", true); return; }
  const botones = document.querySelectorAll("button");
  botones.forEach((b) => (b.disabled = true));
  estado("Consultando…");
  $("res").hidden = true;
  try {
    const proveedor = new ethers.JsonRpcProvider(RPC);
    const c = new ethers.Contract(CONTRATO, ABI, proveedor);

    let ramo = null;
    if (codigoRamo) {
      try { ramo = await c.consultarRamo(codigoRamo); }
      catch (e) {
        if (nombreError(e) === "RamoNoExiste") { estado("No encontramos ese ramo. Revisá el código.", true); return; }
        throw e;
      }
      codigoLote = ramo.idLote;
    }
    if (!codigoLote) { estado("Escribí el código de un lote o de un ramo.", true); return; }

    let l;
    try { l = await c.consultarLote(codigoLote); }
    catch (e) {
      if (nombreError(e) === "LoteNoExiste") { estado("No encontramos ese lote. Revisá el código.", true); return; }
      throw e;
    }

    const d = l.datos;
    const confirmado = Number(l.confirmadoEn) !== 0;
    $("idlote").textContent = d.idLote;
    filas($("datos"), [
      ["Variedad", d.variedad],
      ["Zona", d.zona],
      ["Temporada", d.temporada],
      ["Paquetes", String(Number(d.paquetes))],
      ["Disponibles", String(Number(l.disponibles))],
      ["Fecha de cosecha", fechaDia(d.fechaCosecha)],
      ["Vida útil", Number(d.vidaUtilDias) + " días"],
      ["Productora", corta(l.productor)],
      ["Huella de datos", corta(l.datosHash)]
    ]);
    const et = $("etapas"); et.replaceChildren();
    et.append(etapa("Declarado por la productora", fechaHora(l.declaradoEn) + " · " + corta(l.productor), true));
    et.append(etapa(confirmado ? "Recepción confirmada por la florería" : "Recepción pendiente",
      confirmado ? fechaHora(l.confirmadoEn) + " · " + corta(l.floreria) : "Todavía no llegó a ninguna florería", confirmado));
    if (ramo) et.append(etapa("Ramo armado", fechaHora(ramo.creadoEn) + " · " + corta(ramo.floreria), true));

    $("caja-ramo").hidden = !ramo;
    if (ramo) {
      $("idramo").textContent = codigoRamo;
      filas($("datos-ramo"), [["Lote de origen", ramo.idLote], ["Florería", corta(ramo.floreria)], ["Creado", fechaHora(ramo.creadoEn)]]);
    }
    $("res").hidden = false;
    estado("");
  } catch (e) {
    console.error(e);
    estado("No pudimos leer el registro ahora. Revisá tu conexión y probá de nuevo.", true);
  } finally {
    botones.forEach((b) => (b.disabled = false));
  }
}

$("f-lote").addEventListener("submit", (ev) => { ev.preventDefault(); $("ramo").value = ""; consultar($("lote").value.trim(), ""); });
$("f-ramo").addEventListener("submit", (ev) => { ev.preventDefault(); $("lote").value = ""; consultar("", $("ramo").value.trim()); });

if (!SIN_CONFIGURAR) $("link-contrato").href = EXPLORADOR + CONTRATO;
else $("link-contrato").removeAttribute("href");

// Si el QR trae el código en la dirección (?lote=LOTE-011 o ?ramo=RAMO-001), consulta solo.
const p = new URLSearchParams(location.search);
const qLote = p.get("lote") || p.get("id") || p.get("l") || p.get("codigo");
const qRamo = p.get("ramo") || p.get("r");
if (qLote) $("lote").value = qLote;
if (qRamo) $("ramo").value = qRamo;
if (qLote || qRamo) consultar(qRamo ? "" : qLote, qRamo || "");
else if (SIN_CONFIGURAR) estado("Falta pegar la dirección del contrato en consulta.html.", true);
</script>
</body>
</html>
