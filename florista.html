<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flor Proof · Florist</title>
<style>
:root{--ink:#1f2a44;--muted:#5b6478;--paper:#f4f6f8;--card:#fff;--line:#d5dae3;--ok:#1e7f5c;--okbg:#e2f3ec;--bad:#a3262a;--rose:#b4235a;
--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf6;--muted:#9aa4bc;--paper:#141a2b;--card:#1c2338;--line:#32405f;--ok:#4cc79a;--okbg:#17352d;--bad:#f08a8d;--rose:#ee6b9c}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
main{max-width:30rem;margin:0 auto;padding:1.3rem 1rem 3rem}
h1{font-family:var(--serif);font-size:1.7rem;margin:.1rem 0 .3rem}h1 span{color:var(--rose)}
.sub{margin:0 0 1rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:1.1rem;margin-bottom:1rem}
label{display:block;margin:.8rem 0 .25rem;color:var(--muted);font-size:.95rem}
label:first-child{margin-top:0}
input,select{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:.5rem;background:var(--card);color:var(--ink);font:inherit}
button{width:100%;margin-top:1rem;padding:.8rem 1rem;border:0;border-radius:.5rem;background:var(--ink);color:var(--paper);font:inherit;font-weight:700}
button:disabled{opacity:.6}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.msg{margin:0;color:var(--muted)}.msg.err{color:var(--bad)}
.ok{background:var(--okbg);color:var(--ok);border-radius:.6rem;padding:.8rem;font-weight:700;text-align:center}
.ok small{display:block;font-weight:400;margin-top:.15rem}
#qr{display:grid;place-items:center;margin:1rem 0 .3rem}#qr img,#qr canvas{background:#fff;padding:8px;border-radius:.4rem}
.cod{text-align:center;font-family:ui-monospace,Consolas,monospace}
a{color:var(--rose)}[hidden]{display:none!important}
a.boton{display:block;margin-top:1rem;padding:.8rem 1rem;border-radius:.5rem;background:var(--ink);color:var(--paper);text-align:center;font-weight:700;text-decoration:none}
.lang{display:flex;justify-content:flex-end;gap:.4rem;padding-top:1rem}.lang button{width:auto;margin:0;padding:.25rem .65rem;border:1px solid var(--line);border-radius:.4rem;background:transparent;color:var(--muted);font:inherit;font-size:.85rem;font-weight:700}.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}.lang button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="true">EN</button><button type="button" data-l="es" aria-pressed="false">ES</button></div>
<h1>Flor <span>Proof</span> · Florist</h1>
<p class="sub">Confirm that a batch arrived and make bouquets with their QR code.</p>

<form id="f" class="card">
  <label for="codigo">Access code</label>
  <input id="codigo" type="password" autocomplete="off" required>

  <label for="accion">What do you want to do?</label>
  <select id="accion">
    <option value="confirmar">Confirm receipt of a batch</option>
    <option value="ramo">Make a bouquet</option>
  </select>

  <label for="lote">Batch code</label>
  <input id="lote" placeholder="E.g. LOTE-011" autocomplete="off" required>

  <div id="w-ramo" hidden>
    <label for="ramo">Bouquet code</label>
    <input id="ramo" placeholder="E.g. RAMO-001" autocomplete="off">
  </div>

  <button id="btn" type="submit">Submit</button>
</form>

<section class="card" id="out" aria-live="polite"><p class="msg">Fill in the details and tap Submit.</p></section>
</main>

<script>
const API = "https://flor-proof-backend.vercel.app/api/florista";
const EXPLORADOR = "https://testnet.monadvision.com";
const $ = id => document.getElementById(id);
const el = (t, x, c) => { const n = document.createElement(t); if (x !== undefined) n.textContent = x; if (c) n.className = c; return n; };

let L = "en";
try { L = localStorage.getItem("fp-lang") || ((navigator.language || "").toLowerCase().startsWith("es") ? "es" : "en"); } catch (e) {}
const T = (en, es) => (L === "es" ? es : en);
const ES = {"Flor <span>Proof</span> · Florist": "Flor <span>Proof</span> · Florería", "Confirm that a batch arrived and make bouquets with their QR code.": "Confirmá que te llegó un lote y armá ramos con su código QR.", "Access code": "Código de acceso", "What do you want to do?": "¿Qué querés hacer?", "Confirm receipt of a batch": "Confirmar recepción de un lote", "Make a bouquet": "Armar un ramo", "Batch code": "Código del lote", "Bouquet code": "Código del ramo", "Submit": "Enviar", "Fill in the details and tap Submit.": "Completá los datos y tocá Enviar."};
function applyLang() {
  document.documentElement.lang = L;
  document.querySelectorAll("body *").forEach(n => {
    if (n.tagName === "SCRIPT" || n.closest(".lang")) return;
    const h1 = n.tagName === "H1";
    if (n.children.length && !h1) return;
    if (!n.dataset.en) { const k = h1 ? n.innerHTML : n.textContent.trim(); if (!(k in ES)) return; n.dataset.en = k; }
    const v = L === "es" ? ES[n.dataset.en] : n.dataset.en;
    if (h1) n.innerHTML = v; else n.textContent = v;
  });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === L)));
  $("lote").placeholder = T("E.g. LOTE-011", "Ej.: LOTE-011");
  $("ramo").placeholder = T("E.g. RAMO-001", "Ej.: RAMO-001");
  document.title = T("Flor Proof · Florist", "Flor Proof · Florería");
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { L = b.dataset.l; try { localStorage.setItem("fp-lang", L); } catch (e) {} applyLang(); }));
applyLang();
$("accion").addEventListener("change", () => {
  const esRamo = $("accion").value === "ramo";
  $("w-ramo").hidden = !esRamo;
  $("ramo").required = esRamo;
});

function mensaje(txt, esError) { $("out").replaceChildren(el("p", txt, "msg" + (esError ? " err" : ""))); }

function exito(j) {
  const out = $("out");
  const caja = el("div", j.accion === "ramo" ? T("Bouquet registered", "Ramo registrado") : T("Receipt confirmed", "Recepción confirmada"), "ok");
  caja.append(el("small", T("Batch ", "Lote ") + j.idLote + (j.idRamo ? " · " + T("Bouquet ", "Ramo ") + j.idRamo : "")));
 out.replaceChildren(caja);
  if (j.accion === "ramo") {
    const q = el("a", T("Open the bouquet QR", "Abrir el QR del ramo"), "boton");
    q.href = "qr.html?ramo=" + encodeURIComponent(j.idRamo); q.target = "_blank"; q.rel = "noopener";
    out.append(q);
  }
 
  $("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = $("btn"); btn.disabled = true;
  mensaje(T("Signing… this may take a few seconds.", "Firmando… puede tardar unos segundos."));
  const cuerpo = { codigo: $("codigo").value, accion: $("accion").value, idLote: $("lote").value.trim(), idRamo: $("ramo").value.trim(), lang: L };
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { mensaje(j.error || T("The operation could not be completed.", "No se pudo completar la operación."), true); return; }
    exito(j);
  } catch (e) {
    mensaje(T("Can't reach the server. Please try again.", "No hay conexión con el servidor. Probá de nuevo."), true);
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
